# Copy to config.toml and adjust. Secrets live in .env, not here.

engine = "antigravity"          # antigravity | claude
engine_timeout_s = 900          # per engine call (triage and implementation)
max_tickets_per_run = 3
daily_cap = 10                  # max tickets the bot picks up per calendar day
repair_rounds = 2               # failed checks are fed back to the engine this many times; 0 disables
work_dir = "~/.electa-bot"      # cached clones, worktrees, sqlite state, kill-switch file

git_user_name = "electa-bot"
git_user_email = "electa-bot@users.noreply.github.com"

[jira]
base_url = "https://the-three-devsketeers.atlassian.net"
# Claimed tickets carry the claimed label, so a re-run never picks them up twice.
jql = 'project = VS AND labels = electa-bot AND labels != bot-claimed AND status = "Ready for Bot" ORDER BY created ASC'
claimed_label = "bot-claimed"

[jira.transitions]              # Jira transition names in your workflow
in_progress = "In Progress"
in_review = "In Review"
needs_info = "To Do"          # no "Needs Info" status in VS; bounced tickets go back to To Do

[[repos]]
name = "roselletabuena/electa-fullstack"
default_branch = "main"
jira_projects = ["VS"]
setup_commands = ["npm ci", "npx prisma generate", "npm run agents:sync"]   # run BEFORE the engine; agents:sync mirrors .agents/skills into .claude/skills for Claude
check_commands = [              # all must pass; exactly what app-ci.yml runs (lint, typecheck, unit tests)
  "npm run typecheck",
  "npm run lint",
  "npm run test:unit",
]
allowed_paths = ["src/", "tests/", "public/"]
denied_paths = [".github/", "infra/", "prisma/migrations/", ".agents/", ".env*", "package-lock.json"]
max_diff_lines = 300
